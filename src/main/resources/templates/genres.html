<!DOCTYPE html>
<html lang="uz" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Janrlar')}">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Janrlar — VertexLib</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="/js/api.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .sidebar-link { display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:10px;font-size:0.875rem;font-weight:500;color:#64748b;transition:background 0.15s,color 0.15s;text-decoration:none; }
    .sidebar-link:hover { background:#f1f5f9;color:#1e293b; }
    .sidebar-link.active { background:#eef2ff;color:#4f46e5; }
    .sidebar-link svg { flex-shrink:0;width:18px;height:18px; }
    @keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.4} }
    .skeleton { animation:pulse 1.5s ease-in-out infinite; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)} }
    .fade-in { animation:fadeIn 0.25s ease forwards; }
    .table-row { transition:background 0.1s; }
    .table-row:hover { background:#f8fafc; }
    /* Modal */
    .modal-backdrop { position:fixed;inset:0;background:rgba(15,23,42,0.35);backdrop-filter:blur(2px);z-index:50;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.2s; }
    .modal-backdrop.open { opacity:1;pointer-events:all; }
    .modal-box { background:#fff;border-radius:16px;border:1px solid #e2e8f0;box-shadow:0 20px 60px rgba(0,0,0,0.12);width:100%;max-width:420px;transform:scale(0.97) translateY(6px);transition:transform 0.2s; }
    .modal-backdrop.open .modal-box { transform:scale(1) translateY(0); }
    /* Toast */
    #toast { position:fixed;bottom:24px;right:24px;z-index:100;display:flex;flex-direction:column;gap:8px; }
    .toast-item { padding:10px 16px;border-radius:10px;font-size:0.85rem;font-weight:500;box-shadow:0 4px 16px rgba(0,0,0,0.1);animation:fadeIn 0.2s ease forwards; }
    ::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:99px}
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

<div class="flex h-screen overflow-hidden">

  <!-- SIDEBAR -->

      <div class="flex items-center gap-2.5">
        <div class="h-8 w-8 rounded-lg bg-indigo-600 flex items-center justify-center">
          <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
        </div>
        <span class="text-base font-bold text-slate-900 tracking-tight">VertexLib</span>

    </div>
    <nav class="flex-1 overflow-y-auto px-3 py-4 space-y-0.5">
      <p class="text-xs font-semibold text-slate-400 uppercase tracking-widest px-2 mb-2">Asosiy</p>
      <a href="/VertexLib/templates/dashboard.html" class="sidebar-link ">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        Dashboard
      </a>
      <a href="/VertexLib/templates/movies.html" class="sidebar-link">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 4v16M17 4v16M3 8h4m10 0h4M3 16h4m10 0h4M4 4h16a1 1 0 011 1v14a1 1 0 01-1 1H4a1 1 0 01-1-1V5a1 1 0 011-1z"/></svg>
        Filmlar
      </a>
      <a href="/VertexLib/templates/genres.html" class="sidebar-link active" id="nav-genres">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A2 2 0 013 12V7a2 2 0 012-2z"/></svg>
        Janrlar
      </a>
      <a href="/VertexLib/templates/loans.html" class="sidebar-link">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        Ijaralar
      </a>
      <a href="/VertexLib/templates/users.html" class="sidebar-link">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
        A'zolar
      </a>
      <div class="pt-3">
        <p class="text-xs font-semibold text-slate-400 uppercase tracking-widest px-2 mb-2">Hisobot</p>
        <a href="/reports" class="sidebar-link">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
          Statistika
        </a>
      </div>
    </nav>
    <div class="px-3 py-3 border-t border-slate-100">
      <div class="flex items-center gap-3 px-2 py-2 rounded-lg hover:bg-slate-50 cursor-pointer transition-colors"
           onclick="api.logout ? api.logout() : (localStorage.removeItem('token'), window.location.href='/login')">
        <div class="h-8 w-8 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-600 flex-shrink-0">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-xs font-semibold text-slate-700 truncate">Admin</p>
          <p class="text-xs text-slate-400">Chiqish</p>
        </div>
        <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="flex-1 overflow-y-auto">

    <!-- Topbar -->
    <div class="sticky top-0 z-10 bg-white/80 backdrop-blur border-b border-slate-100 px-8 py-4 flex items-center justify-between">
      <div>
        <h1 class="text-lg font-bold text-slate-900 leading-tight">Janrlar</h1>
        <p class="text-xs text-slate-400 mt-0.5">Film janrlari boshqaruvi</p>
      </div>
      <div class="flex items-center gap-3">
        <span class="text-xs text-slate-400 font-medium" id="totalCount"></span>
        <button id="addBtn" onclick="openCreate()" style="display:none"
                class="inline-flex items-center gap-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-4 py-2 rounded-lg transition-colors shadow-sm">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
          Janr qo'shish
        </button>
      </div>
    </div>

    <div class="p-8">
      <div class="bg-white rounded-xl border border-slate-100 shadow-sm overflow-hidden">
        <div id="genresTable">
          <div class="flex items-center justify-center gap-3 py-16 text-slate-400 text-sm">
            <svg class="w-5 h-5 animate-spin text-indigo-400" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/></svg>
            Yuklanmoqda...
          </div>
        </div>
        <div class="px-6 py-3 border-t border-slate-50 flex items-center justify-between" id="paginationWrap" style="display:none!important">
          <span class="text-xs text-slate-400" id="pageInfo"></span>
          <div class="flex gap-1" id="pagination"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- ===== CREATE MODAL ===== -->
<div class="modal-backdrop" id="createModal">
  <div class="modal-box">
    <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100">
      <h3 class="text-sm font-semibold text-slate-800">Yangi janr qo'shish</h3>
      <button onclick="closeModal('createModal')" class="h-8 w-8 rounded-lg hover:bg-slate-100 flex items-center justify-center text-slate-400 hover:text-slate-600 transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="px-6 py-5 space-y-4">
      <div id="createAlert"></div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Janr nomi <span class="text-red-400">*</span></label>
        <input type="text" id="c_name" maxlength="60" placeholder="Masalan: Roman"
               class="w-full px-4 py-2.5 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all text-sm">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Tavsif</label>
        <textarea id="c_desc" maxlength="132" placeholder="Qisqacha tavsif..." rows="3"
                  class="w-full px-4 py-2.5 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all text-sm resize-none"></textarea>
      </div>
    </div>
    <div class="flex justify-end gap-2 px-6 py-4 border-t border-slate-100 bg-slate-50/50 rounded-b-2xl">
      <button onclick="closeModal('createModal')" class="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-lg transition-colors">Bekor qilish</button>
      <button onclick="createGenre()" class="px-4 py-2 text-sm font-medium bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg transition-colors shadow-sm">Saqlash</button>
    </div>
  </div>
</div>

<!-- ===== EDIT MODAL ===== -->
<div class="modal-backdrop" id="editModal">
  <div class="modal-box">
    <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100">
      <h3 class="text-sm font-semibold text-slate-800">Janrni tahrirlash</h3>
      <button onclick="closeModal('editModal')" class="h-8 w-8 rounded-lg hover:bg-slate-100 flex items-center justify-center text-slate-400 hover:text-slate-600 transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="px-6 py-5 space-y-4">
      <div id="editAlert"></div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Janr nomi <span class="text-red-400">*</span></label>
        <input type="text" id="e_name" maxlength="60"
               class="w-full px-4 py-2.5 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all text-sm">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Tavsif</label>
        <textarea id="e_desc" maxlength="132" rows="3"
                  class="w-full px-4 py-2.5 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all text-sm resize-none"></textarea>
      </div>
    </div>
    <div class="flex justify-end gap-2 px-6 py-4 border-t border-slate-100 bg-slate-50/50 rounded-b-2xl">
      <button onclick="closeModal('editModal')" class="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-lg transition-colors">Bekor qilish</button>
      <button onclick="updateGenre()" class="px-4 py-2 text-sm font-medium bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg transition-colors shadow-sm">Saqlash</button>
    </div>
  </div>
</div>

<!-- ===== DELETE MODAL ===== -->
<div class="modal-backdrop" id="deleteModal">
  <div class="modal-box" style="max-width:360px">
    <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100">
      <h3 class="text-sm font-semibold text-slate-800">Janrni o'chirish</h3>
      <button onclick="closeModal('deleteModal')" class="h-8 w-8 rounded-lg hover:bg-slate-100 flex items-center justify-center text-slate-400 hover:text-slate-600 transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="px-6 py-5">
      <div class="flex gap-3">
        <div class="h-10 w-10 rounded-xl bg-red-50 flex items-center justify-center flex-shrink-0">
          <svg class="w-5 h-5 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
        </div>
        <div>
          <p class="text-sm font-medium text-slate-800">Haqiqatan o'chirmoqchimisiz?</p>
          <p class="text-xs text-slate-500 mt-1"><strong class="text-slate-700 font-semibold" id="deleteGenreName"></strong> janri o'chiriladi. Bu amalni qaytarib bo'lmaydi.</p>
        </div>
      </div>
    </div>
    <div class="flex justify-end gap-2 px-6 py-4 border-t border-slate-100 bg-slate-50/50 rounded-b-2xl">
      <button onclick="closeModal('deleteModal')" class="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-lg transition-colors">Bekor qilish</button>
      <button onclick="deleteGenre()" class="px-4 py-2 text-sm font-medium bg-red-500 hover:bg-red-600 text-white rounded-lg transition-colors shadow-sm">O'chirish</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
  const isStaff = typeof currentUser !== 'undefined' && currentUser && (currentUser.role === 'STAFF' || currentUser.role === 'ADMIN');
  if (isStaff) document.getElementById('addBtn').style.display = '';

  let state = { page: 0, size: 20, total: 0, genres: [] };
  let editingId = null, deletingId = null;

  const MOCK_GENRES = [
    { id: '1',  name: 'Roman' },
    { id: '2',  name: 'She\'riyat' },
    { id: '3',  name: 'Detektiv' },
    { id: '4',  name: 'Ilmiy fantastika' },
    { id: '5',  name: 'Tarix' },
    { id: '6',  name: 'Falsafa' },
    { id: '7',  name: 'Psixologiya' },
    { id: '8',  name: 'Bolalar adabiyoti' },
    { id: '9',  name: 'Biografiya' },
    { id: '10', name: 'Sarguzasht' },
    { id: '11', name: 'Drama' },
    { id: '12', name: 'Qo\'rqinchli' },
    { id: '13', name: 'Biznes va iqtisodiyot' },
    { id: '14', name: 'Fantastika' },
    { id: '15', name: 'Komediya' },
    { id: '16', name: 'Triller' },
    { id: '17', name: 'Hujjatli' },
    { id: '18', name: 'Memuar' },
    { id: '19', name: 'Diniy adabiyot' },
    { id: '20', name: 'Musiqa' },
    { id: '21', name: 'San\'at' },
    { id: '22', name: 'Sayohat' },
    { id: '23', name: 'Pazandachilik' },
    { id: '24', name: 'Sog\'liqni saqlash' },
    { id: '25', name: 'Sport' },
    { id: '26', name: 'Siyosat' },
    { id: '27', name: 'O\'quv qo\'llanma' }
  ];

  async function loadGenres() {
    document.getElementById('genresTable').innerHTML = `
            <div class="flex items-center justify-center gap-3 py-16 text-slate-400 text-sm">
                <svg class="w-5 h-5 animate-spin text-indigo-400" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/>
                </svg>Yuklanmoqda...
            </div>`;

    // Paginate mock data
    const start = state.page * state.size;
    state.total = MOCK_GENRES.length;
    state.genres = MOCK_GENRES.slice(start, start + state.size);
    const totalPages = Math.ceil(state.total / state.size);

    document.getElementById('totalCount').textContent = `Jami: ${state.total} ta janr`;
    renderTable();
    renderPagination(totalPages);
  }

  function renderTable() {
    if (!state.genres.length) {
      document.getElementById('genresTable').innerHTML = `
                <div class="flex flex-col items-center justify-center py-16 text-slate-400">
                    <svg class="w-10 h-10 mb-3 text-slate-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A2 2 0 013 12V7a2 2 0 012-2z"/></svg>
                    <p class="text-sm font-medium">Janrlar topilmadi</p>
                </div>`;
      return;
    }

    const rows = state.genres.map((g, i) => `
            <tr class="table-row border-b border-slate-50 last:border-0">
                <td class="px-6 py-3.5 text-xs text-slate-400 font-mono w-12">${state.page * state.size + i + 1}</td>
                <td class="px-6 py-3.5">
                    <span class="text-sm font-medium text-slate-800">${esc(g.name)}</span>
                </td>
                ${isStaff ? `<td class="px-6 py-3.5 text-right w-36">
                    <div class="flex items-center justify-end gap-2">
                        <button onclick="openEdit('${g.id}')"
                            class="inline-flex items-center gap-1 px-3 py-1.5 text-xs font-medium text-slate-600 border border-slate-200 rounded-lg hover:bg-slate-50 hover:border-slate-300 transition-colors">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                            Tahrir
                        </button>
                        <button onclick="openDelete('${g.id}','${esc(g.name).replace(/'/g,"\\'")}') "
                            class="inline-flex items-center gap-1 px-3 py-1.5 text-xs font-medium text-red-500 border border-red-100 rounded-lg hover:bg-red-50 transition-colors">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                            O'chir
                        </button>
                    </div>
                </td>` : ''}
            </tr>`).join('');

    document.getElementById('genresTable').innerHTML = `
            <table class="w-full text-left fade-in">
                <thead>
                    <tr class="border-b border-slate-100 bg-slate-50/60">
                        <th class="px-6 py-3 text-xs font-semibold text-slate-400 uppercase tracking-wider w-12">#</th>
                        <th class="px-6 py-3 text-xs font-semibold text-slate-400 uppercase tracking-wider">Janr nomi</th>
                        ${isStaff ? '<th class="px-6 py-3 text-xs font-semibold text-slate-400 uppercase tracking-wider text-right">Amallar</th>' : ''}
                    </tr>
                </thead>
                <tbody>${rows}</tbody>
            </table>`;
  }

  function renderPagination(totalPages) {
    const wrap = document.getElementById('paginationWrap');
    if (totalPages <= 1) { wrap.style.display = 'none'; return; }
    wrap.style.removeProperty('display');
    document.getElementById('pageInfo').textContent = `${state.page + 1} / ${totalPages} sahifa`;
    let html = `<button onclick="goPage(${state.page-1})" ${state.page===0?'disabled':''} class="px-3 py-1.5 text-xs font-medium border border-slate-200 rounded-lg text-slate-600 hover:bg-slate-50 disabled:opacity-40 disabled:cursor-not-allowed transition-colors">← Oldingi</button>`;
    for (let i = 0; i < totalPages; i++) {
      html += `<button onclick="goPage(${i})" class="px-3 py-1.5 text-xs font-medium border rounded-lg transition-colors ${i===state.page ? 'bg-indigo-600 border-indigo-600 text-white' : 'border-slate-200 text-slate-600 hover:bg-slate-50'}">${i+1}</button>`;
    }
    html += `<button onclick="goPage(${state.page+1})" ${state.page>=totalPages-1?'disabled':''} class="px-3 py-1.5 text-xs font-medium border border-slate-200 rounded-lg text-slate-600 hover:bg-slate-50 disabled:opacity-40 disabled:cursor-not-allowed transition-colors">Keyingi →</button>`;
    document.getElementById('pagination').innerHTML = html;
  }
  function goPage(p) { state.page = p; loadGenres(); }

  function openCreate() {
    document.getElementById('c_name').value = '';
    document.getElementById('c_desc').value = '';
    document.getElementById('createAlert').innerHTML = '';
    openModal('createModal');
    setTimeout(() => document.getElementById('c_name').focus(), 200);
  }

  async function createGenre() {
    const name = document.getElementById('c_name').value.trim();
    const description = document.getElementById('c_desc').value.trim();
    if (!name) { showAlert('createAlert', 'Janr nomi kiritilishi shart'); return; }
    const res = await api('POST', '/api/v1/genres', { name, description });
    if (!res) return;
    if (!res.ok) { const err = await res.json().catch(()=>({})); showAlert('createAlert', err.message||'Xatolik'); return; }
    closeModal('createModal');
    showToast('Janr muvaffaqiyatli qo\'shildi', 'success');
    loadGenres();
  }

  function openEdit(id) {
    const g = state.genres.find(g => g.id === id);
    if (!g) return;
    editingId = id;
    document.getElementById('e_name').value = g.name || '';
    document.getElementById('e_desc').value = g.description || '';
    document.getElementById('editAlert').innerHTML = '';
    openModal('editModal');
    setTimeout(() => document.getElementById('e_name').focus(), 200);
  }

  async function updateGenre() {
    const name = document.getElementById('e_name').value.trim();
    const description = document.getElementById('e_desc').value.trim();
    if (!name) { showAlert('editAlert', 'Janr nomi kiritilishi shart'); return; }
    const res = await api('PUT', `/api/v1/genres/${editingId}`, { name, description });
    if (!res) return;
    if (!res.ok) { const err = await res.json().catch(()=>({})); showAlert('editAlert', err.message||'Xatolik'); return; }
    closeModal('editModal');
    showToast('Janr yangilandi', 'success');
    loadGenres();
  }

  function openDelete(id, name) {
    deletingId = id;
    document.getElementById('deleteGenreName').textContent = name;
    openModal('deleteModal');
  }

  async function deleteGenre() {
    await api('DELETE', `/api/v1/genres/${deletingId}`);
    closeModal('deleteModal');
    showToast('Janr o\'chirildi', 'error');
    loadGenres();
  }

  // Modal helpers
  function openModal(id) { document.getElementById(id).classList.add('open'); }
  function closeModal(id) { document.getElementById(id).classList.remove('open'); }
  document.querySelectorAll('.modal-backdrop').forEach(el => {
    el.addEventListener('click', e => { if (e.target === el) el.classList.remove('open'); });
  });

  // Alert helper
  function showAlert(id, msg) {
    document.getElementById(id).innerHTML = `<div class="flex items-center gap-2 bg-red-50 text-red-600 text-xs font-medium p-3 rounded-lg border border-red-100 mb-1"><svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>${msg}</div>`;
  }

  // Toast helper
  function showToast(msg, type='success') {
    const t = document.getElementById('toast');
    const el = document.createElement('div');
    el.className = `toast-item ${type==='success' ? 'bg-slate-800 text-white' : type==='error' ? 'bg-red-500 text-white' : 'bg-slate-800 text-white'}`;
    el.textContent = msg;
    t.appendChild(el);
    setTimeout(() => el.remove(), 3000);
  }

  function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  loadGenres();
</script>
</body>
</html>
