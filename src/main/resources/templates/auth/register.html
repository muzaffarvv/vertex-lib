<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ro'yxatdan o'tish — VertexLib</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="/js/api.js"></script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-100 p-8">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Hisob yaratish</h1>
            <p class="text-sm text-slate-500 mt-2">VertexLib-ga bugun qo'shiling</p>
        </div>

        <form th:action="@{/register}" th:object="${registerRequest}" method="post" class="space-y-5">
            <div th:if="${error}" class="bg-red-50 text-red-600 text-sm p-3 rounded-lg border border-red-100" th:text="${error}"></div>

            <div>
                <label for="fullName" class="block text-sm font-medium text-slate-700 mb-1">To'liq ism</label>
                <input type="text" th:field="*{fullName}" id="fullName" required
                    class="w-full px-4 py-2.5 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all text-sm"
                    placeholder="John Doe">
                <p th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" class="text-red-500 text-xs mt-1"></p>
            </div>

            <div>
                <label for="phoneNumber" class="block text-sm font-medium text-slate-700 mb-1">Telefon raqami</label>
                <input type="text" th:field="*{phoneNumber}" id="phoneNumber" required
                    class="w-full px-4 py-2.5 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all text-sm"
                    placeholder="998XXXXXXXXX">
                <p th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}" class="text-red-500 text-xs mt-1"></p>
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Parol</label>
                <input type="password" th:field="*{password}" id="password" required
                    class="w-full px-4 py-2.5 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all text-sm"
                    placeholder="••••••••">
                <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-red-500 text-xs mt-1"></p>
            </div>

            <button type="submit"
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition-colors shadow-sm mt-2 flex justify-center items-center gap-2">
                Ro'yxatdan o'tish
            </button>
        </form>

        <div class="mt-6 text-center text-sm text-slate-500">
            Hisobingiz bormi? 
            <a th:href="@{/login}" class="text-indigo-600 font-medium hover:text-indigo-700 hover:underline transition-all">Kirish</a>
        </div>
    </div>

    <script>
        if (api.isAuthenticated()) {
            window.location.href = '/dashboard';
        }
    </script>
</body>
</html>
