<!DOCTYPE html>
<html lang="uz" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="header(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' ??VertexLib'">VertexLib</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/main.css}">
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="/js/api.js"></script>
    <script>
        // Global auth check
        if (!api.isAuthenticated()) {
            window.location.href = '/login';
        }
        const currentUser = JSON.parse(localStorage.getItem('user') || '{}');
    </script>
</head>
<body th:fragment="layout(title, content)">
    <div class="sidebar">
        <div class="sidebar-logo">Vertex<span>Lib</span></div>
        <div class="nav">
            <div class="nav-section">Asosiy</div>
            <a th:href="@{/dashboard}" id="nav-dashboard">
                <span class="icon">?“Š</span> Dashboard
            </a>
            
            <div class="nav-section">Kutubxona</div>
            <a th:href="@{/movies}" id="nav-movies">
                <span class="icon">?“š</span> Kitoblar
            </a>
            <a th:href="@{/genres}" id="nav-genres">
                <span class="icon">?·ï¸?/span> Janrlar
            </a>
            <a th:href="@{/loans}" id="nav-loans">
                <span class="icon">?”„</span> Ijara
            </a>
            
            <div class="nav-section staff-only" style="display:none">Boshqaruv</div>
            <a th:href="@{/users}" id="nav-users" class="staff-only" style="display:none">
                <span class="icon">?‘¥</span> Foydalanuvchilar
            </a>
        </div>
        
        <div class="sidebar-footer">
            <div class="user-info">
                <div class="user-avatar" id="userInitials">U</div>
                <div>
                    <div class="user-name" id="userName">Foydalanuvchi</div>
                    <div class="user-role" id="userRole">MEMBER</div>
                </div>
            </div>
            <button class="logout-btn" onclick="logout()">Chiqish</button>
        </div>
    </div>

    <div class="main">
        <div class="topbar">
            <div>
                <div class="page-title" id="topbarTitle" th:text="${title}">Dashboard</div>
                <div class="page-sub" id="topbarSub">Xush kelibsiz!</div>
            </div>
            <div id="toast-container"></div>
        </div>
        <div class="content">
            <div th:replace="${content}"></div>
        </div>
    </div>

    <script th:inline="javascript">
        // Sidebar active state and user info
        function setupLayout() {
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            if (user) {
                document.getElementById('userName').textContent = user.fullName || user.phoneNumber || 'Foydalanuvchi';
                document.getElementById('userRole').textContent = user.role || 'MEMBER';
                document.getElementById('userInitials').textContent = (user.fullName || 'U').charAt(0).toUpperCase();
                
                if (user.role === 'STAFF' || user.role === 'ADMIN') {
                    document.querySelectorAll('.staff-only').forEach(el => el.style.display = 'flex');
                }
            }
            
            // Set active class based on current path
            const path = window.location.pathname;
            if (path.includes('dashboard')) document.getElementById('nav-dashboard')?.classList.add('active');
            if (path.includes('movies')) document.getElementById('nav-dashboard')?.classList.remove('active'); // fallback
            // More logic can be added or handled in individual pages
        }

        function logout() {
            api.clearToken();
            localStorage.removeItem('user');
            window.location.href = '/login';
        }

        setupLayout();

        // Helper to escape HTML
        function esc(str) {
            if (!str) return '';
            const p = document.createElement('p');
            p.textContent = str;
            return p.innerHTML;
        }

        // Global Toast system
        window.toast = {
            show(msg, type = 'success') {
                const container = document.getElementById('toast-container');
                const t = document.createElement('div');
                t.className = `toast ${type}`;
                t.innerHTML = `<span>${type === 'success' ? '?? : '??}</span><span>${msg}</span>`;
                container.appendChild(t);
                setTimeout(() => t.remove(), 3000);
            },
            success(msg) { this.show(msg, 'success'); },
            error(msg) { this.show(msg, 'error'); }
        };
    </script>
</body>
</html>
