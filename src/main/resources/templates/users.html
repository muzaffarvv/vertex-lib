<!DOCTYPE html>
<html lang="uz" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Foydalanuvchilar')}">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foydalanuvchilar — VertexLib</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<!--  <script src="/js/api.js"></script>-->
  <style>
    body { font-family: 'Inter', sans-serif; }
    .sidebar-link {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 14px; border-radius: 10px;
      font-size: 0.875rem; font-weight: 500; color: #64748b;
      transition: background 0.15s, color 0.15s; text-decoration: none;
    }
    .sidebar-link:hover { background: #f1f5f9; color: #1e293b; }
    .sidebar-link.active { background: #eef2ff; color: #4f46e5; }
    .sidebar-link svg { flex-shrink: 0; width: 18px; height: 18px; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .skeleton { animation: pulse 1.5s ease-in-out infinite; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 99px; }
    .row-hover { transition: background 0.12s; }
    .row-hover:hover { background: #f8fafc; }
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen" x-data="usersApp()" x-init="init()">

<div class="flex h-screen overflow-hidden">

  <!-- SIDEBAR -->
  <aside class="w-60 bg-white border-r border-slate-100 flex flex-col flex-shrink-0 h-full">
    <div class="px-5 py-5 border-b border-slate-100">
      <div class="flex items-center gap-2.5">
        <div class="h-8 w-8 rounded-lg bg-indigo-600 flex items-center justify-center">
          <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                  d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
          </svg>
        </div>
        <span class="text-base font-bold text-slate-900 tracking-tight">VertexLib</span>
      </div>
    </div>
    <nav class="flex-1 overflow-y-auto px-3 py-4 space-y-0.5">
      <p class="text-xs font-semibold text-slate-400 uppercase tracking-widest px-2 mb-2">Asosiy</p>
      <a href="/VertexLib/templates/dashboard.html" class="sidebar-link ">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        Dashboard
      </a>
      <a href="/VertexLib/templates/movies.html" class="sidebar-link">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 4v16M17 4v16M3 8h4m10 0h4M3 16h4m10 0h4M4 4h16a1 1 0 011 1v14a1 1 0 01-1 1H4a1 1 0 01-1-1V5a1 1 0 011-1z"/></svg>
        Filmlar
      </a>
      <a href="/VertexLib/templates/genres.html" class="sidebar-link" id="nav-genres">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A2 2 0 013 12V7a2 2 0 012-2z"/></svg>
        Janrlar
      </a>
      <a href="/VertexLib/templates/loans.html" class="sidebar-link">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        Ijaralar
      </a>
      <a href="/VertexLib/templates/users.html" class="sidebar-link active">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
        A'zolar
      </a>
      <div class="pt-3">
        <p class="text-xs font-semibold text-slate-400 uppercase tracking-widest px-2 mb-2">Hisobot</p>
        <a href="/reports" class="sidebar-link">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
          Statistika
        </a>
      </div>
    </nav>
    <div class="px-3 py-3 border-t border-slate-100">
      <div class="flex items-center gap-3 px-2 py-2 rounded-lg hover:bg-slate-50 cursor-pointer transition-colors"
           x-on:click="api.logout ? api.logout() : (localStorage.removeItem('token'), window.location.href='/login')">
        <div class="h-8 w-8 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-600 flex-shrink-0">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-xs font-semibold text-slate-700 truncate" x-text="currentUserName">Admin</p>
          <p class="text-xs text-slate-400">Chiqish</p>
        </div>
        <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
      </div>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="flex-1 overflow-y-auto">

    <!-- Top bar -->
    <div class="sticky top-0 z-10 bg-white/80 backdrop-blur border-b border-slate-100 px-8 py-4 flex items-center justify-between">
      <div>
        <h1 class="text-lg font-bold text-slate-900 leading-tight">Foydalanuvchilar</h1>
        <p class="text-xs text-slate-400 mt-0.5">Tizim foydalanuvchilari boshqaruvi</p>
      </div>
      <div class="flex items-center gap-3">
        <button @click="loadUsers()"
                class="h-9 w-9 rounded-lg border border-slate-200 flex items-center justify-center text-slate-500 hover:bg-slate-50 hover:text-indigo-600 transition-colors"
                :class="loading ? 'animate-spin text-indigo-400' : ''">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        </button>
        <button @click="openCreateModal()"
                class="inline-flex items-center gap-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-4 py-2 rounded-lg transition-colors shadow-sm">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
          Foydalanuvchi qo'shish
        </button>
      </div>
    </div>

    <div class="p-8 space-y-6">

      <!-- Filter bar -->
      <div class="flex items-center gap-3">
        <div class="flex bg-white border border-slate-200 rounded-lg p-1 gap-1">
          <button @click="filterRole = ''; loadUsers()"
                  class="px-3 py-1.5 rounded-md text-sm font-medium transition-colors"
                  :class="filterRole === '' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-50'">
            Barchasi
          </button>
          <button @click="filterRole = 'MEMBER'; loadUsers()"
                  class="px-3 py-1.5 rounded-md text-sm font-medium transition-colors"
                  :class="filterRole === 'MEMBER' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-50'">
            A'zolar
          </button>
          <button @click="filterRole = 'STAFF'; loadUsers()"
                  class="px-3 py-1.5 rounded-md text-sm font-medium transition-colors"
                  :class="filterRole === 'STAFF' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-50'">
            Xodimlar
          </button>
        </div>
        <span class="text-sm text-slate-400" x-show="!loading" x-cloak>
                    Jami: <span class="font-semibold text-slate-700" x-text="totalElements">0</span>
                </span>
      </div>

      <!-- Table card -->
      <div class="bg-white rounded-xl border border-slate-100 shadow-sm overflow-hidden">

        <!-- Loading skeleton -->
        <template x-if="loading">
          <div class="divide-y divide-slate-50">
            <div class="px-6 py-3 border-b border-slate-100 bg-slate-50/40">
              <div class="grid grid-cols-4 gap-4">
                <div class="skeleton h-3.5 bg-slate-100 rounded w-12"></div>
                <div class="skeleton h-3.5 bg-slate-100 rounded w-16"></div>
                <div class="skeleton h-3.5 bg-slate-100 rounded w-10"></div>
                <div class="skeleton h-3.5 bg-slate-100 rounded w-14"></div>
              </div>
            </div>
            <template x-for="i in [1,2,3,4,5,6,7,8]" :key="i">
              <div class="px-6 py-3.5 grid grid-cols-4 gap-4 items-center">
                <div class="skeleton h-4 bg-slate-100 rounded w-32"></div>
                <div class="skeleton h-4 bg-slate-100 rounded w-28"></div>
                <div class="skeleton h-5 bg-slate-100 rounded-full w-16"></div>
                <div class="flex gap-2">
                  <div class="skeleton h-7 bg-slate-100 rounded-lg w-20"></div>
                  <div class="skeleton h-7 bg-slate-100 rounded-lg w-16"></div>
                </div>
              </div>
            </template>
          </div>
        </template>

        <!-- Empty state -->
        <template x-if="!loading && users.length === 0">
          <div class="flex flex-col items-center justify-center py-20 text-slate-400">
            <svg class="w-12 h-12 mb-3 text-slate-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            <p class="text-sm font-medium">Foydalanuvchilar topilmadi</p>
          </div>
        </template>

        <!-- Table -->
        <template x-if="!loading && users.length > 0">
          <div class="overflow-x-auto">
            <table class="w-full text-left">
              <thead>
              <tr class="border-b border-slate-100 bg-slate-50/40">
                <th class="px-6 py-3 text-xs font-semibold text-slate-400 uppercase tracking-wider">Ism</th>
                <th class="px-6 py-3 text-xs font-semibold text-slate-400 uppercase tracking-wider">Telefon</th>
                <th class="px-6 py-3 text-xs font-semibold text-slate-400 uppercase tracking-wider">Rol</th>
                <th class="px-6 py-3 text-xs font-semibold text-slate-400 uppercase tracking-wider">Amallar</th>
              </tr>
              </thead>
              <tbody class="divide-y divide-slate-50">
              <template x-for="u in users" :key="u.id">
                <tr class="row-hover">
                  <td class="px-6 py-3.5">
                    <div class="flex items-center gap-3">
                      <div class="h-8 w-8 rounded-full flex items-center justify-center text-xs font-bold flex-shrink-0"
                           :class="u.role === 'STAFF' || u.role === 'ADMIN' ? 'bg-indigo-100 text-indigo-600' : 'bg-green-100 text-green-600'"
                           x-text="(u.fullName || '?').charAt(0).toUpperCase()"></div>
                      <span class="text-sm font-medium text-slate-800" x-text="u.fullName || '—'"></span>
                    </div>
                  </td>
                  <td class="px-6 py-3.5 text-sm text-slate-500 font-mono" x-text="u.phoneNumber || '—'"></td>
                  <td class="px-6 py-3.5">
                                            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium"
                                                  :class="u.role === 'STAFF' || u.role === 'ADMIN'
                                                    ? 'bg-indigo-100 text-indigo-700'
                                                    : 'bg-green-100 text-green-700'"
                                                  x-text="u.role"></span>
                  </td>
                  <td class="px-6 py-3.5">
                    <div class="flex items-center gap-2">
                      <button @click="openEdit(u)"
                              class="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg text-xs font-medium border border-slate-200 text-slate-600 hover:bg-slate-50 hover:text-indigo-600 hover:border-indigo-200 transition-colors">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                        Tahrirlash
                      </button>
                      <button @click="openDelete(u)"
                              class="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg text-xs font-medium border border-red-100 text-red-500 hover:bg-red-50 hover:border-red-200 transition-colors">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                        O'chirish
                      </button>
                    </div>
                  </td>
                </tr>
              </template>
              </tbody>
            </table>
          </div>
        </template>

        <!-- Pagination -->
        <template x-if="totalPages > 1">
          <div class="px-6 py-4 border-t border-slate-100 flex items-center justify-between">
            <span class="text-xs text-slate-400">Sahifa <span class="font-medium text-slate-600" x-text="page + 1"></span> / <span x-text="totalPages"></span></span>
            <div class="flex items-center gap-1">
              <button @click="goPage(page - 1)" :disabled="page === 0"
                      class="h-8 w-8 rounded-lg border border-slate-200 flex items-center justify-center text-slate-500 hover:bg-slate-50 disabled:opacity-40 disabled:cursor-not-allowed transition-colors text-sm">
                ←
              </button>
              <template x-for="p in pageRange" :key="p">
                <button @click="goPage(p)"
                        class="h-8 w-8 rounded-lg border text-sm font-medium transition-colors"
                        :class="p === page ? 'bg-indigo-600 border-indigo-600 text-white' : 'border-slate-200 text-slate-600 hover:bg-slate-50'"
                        x-text="p + 1"></button>
              </template>
              <button @click="goPage(page + 1)" :disabled="page >= totalPages - 1"
                      class="h-8 w-8 rounded-lg border border-slate-200 flex items-center justify-center text-slate-500 hover:bg-slate-50 disabled:opacity-40 disabled:cursor-not-allowed transition-colors text-sm">
                →
              </button>
            </div>
          </div>
        </template>
      </div>
    </div>
  </main>
</div>

<!-- ===== CREATE MODAL ===== -->
<div x-show="showCreate" x-cloak
     class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4"
     @click.self="showCreate = false">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md" @click.stop>
    <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100">
      <h2 class="text-base font-semibold text-slate-900">Yangi foydalanuvchi</h2>
      <button @click="showCreate = false" class="h-8 w-8 rounded-lg flex items-center justify-center text-slate-400 hover:bg-slate-100 transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="px-6 py-5 space-y-4">
      <div x-show="createError" x-cloak class="flex items-center gap-2 p-3 bg-red-50 border border-red-100 rounded-lg text-sm text-red-600" x-text="createError"></div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1.5">To'liq ism *</label>
        <input type="text" x-model="form.fullName" maxlength="132" placeholder="Ism Familiya"
               class="w-full px-3.5 py-2.5 rounded-lg border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1.5">Telefon *</label>
          <input type="text" x-model="form.phoneNumber" placeholder="998XXXXXXXXX" maxlength="12"
                 class="w-full px-3.5 py-2.5 rounded-lg border border-slate-200 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1.5">Rol *</label>
          <select x-model="form.role"
                  class="w-full px-3.5 py-2.5 rounded-lg border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all bg-white">
            <option class="" value="MEMBER">MEMBER</option>
            <option value="STAFF">STAFF</option>
          </select>
        </div>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1.5">Parol *</label>
        <input type="password" x-model="form.password" placeholder="Kamida 8 belgi"
               class="w-full px-3.5 py-2.5 rounded-lg border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
      </div>
    </div>
    <div class="flex items-center justify-end gap-3 px-6 py-4 border-t border-slate-100 bg-slate-50/50 rounded-b-2xl">
      <button @click="showCreate = false" class="px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 transition-colors">Bekor qilish</button>
      <button @click="createUser()" :disabled="saving"
              class="px-4 py-2 rounded-lg text-sm font-medium bg-indigo-600 hover:bg-indigo-700 text-white shadow-sm transition-colors disabled:opacity-60">
        <span x-show="!saving">Saqlash</span>
        <span x-show="saving" x-cloak>Saqlanmoqda...</span>
      </button>
    </div>
  </div>
</div>

<!-- ===== EDIT MODAL ===== -->
<div x-show="showEdit" x-cloak
     class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4"
     @click.self="showEdit = false">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md" @click.stop>
    <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100">
      <h2 class="text-base font-semibold text-slate-900">Foydalanuvchini tahrirlash</h2>
      <button @click="showEdit = false" class="h-8 w-8 rounded-lg flex items-center justify-center text-slate-400 hover:bg-slate-100 transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="px-6 py-5 space-y-4">
      <div x-show="editError" x-cloak class="flex items-center gap-2 p-3 bg-red-50 border border-red-100 rounded-lg text-sm text-red-600" x-text="editError"></div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1.5">To'liq ism *</label>
        <input type="text" x-model="editForm.fullName" maxlength="132"
               class="w-full px-3.5 py-2.5 rounded-lg border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1.5">Telefon *</label>
          <input type="text" x-model="editForm.phoneNumber" maxlength="12"
                 class="w-full px-3.5 py-2.5 rounded-lg border border-slate-200 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1.5">Rol *</label>
          <select x-model="editForm.role"
                  class="w-full px-3.5 py-2.5 rounded-lg border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all bg-white">
            <option value="MEMBER">A'zo (MEMBER)</option>
            <option value="STAFF">Xodim (STAFF)</option>
          </select>
        </div>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1.5">Yangi parol *</label>
        <input type="password" x-model="editForm.password" placeholder="Yangi parol kiriting"
               class="w-full px-3.5 py-2.5 rounded-lg border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
      </div>
    </div>
    <div class="flex items-center justify-end gap-3 px-6 py-4 border-t border-slate-100 bg-slate-50/50 rounded-b-2xl">
      <button @click="showEdit = false" class="px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 transition-colors">Bekor qilish</button>
      <button @click="updateUser()" :disabled="saving"
              class="px-4 py-2 rounded-lg text-sm font-medium bg-indigo-600 hover:bg-indigo-700 text-white shadow-sm transition-colors disabled:opacity-60">
        <span x-show="!saving">Saqlash</span>
        <span x-show="saving" x-cloak>Saqlanmoqda...</span>
      </button>
    </div>
  </div>
</div>

<!-- ===== DELETE MODAL ===== -->
<div x-show="showDelete" x-cloak
     class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4"
     @click.self="showDelete = false">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm" @click.stop>
    <div class="px-6 pt-6 pb-4 text-center">
      <div class="h-12 w-12 rounded-full bg-red-100 flex items-center justify-center mx-auto mb-4">
        <svg class="w-6 h-6 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
      </div>
      <h3 class="text-base font-semibold text-slate-900 mb-1">Foydalanuvchini o'chirish</h3>
      <p class="text-sm text-slate-500"><span class="font-semibold text-slate-700" x-text="deleteTarget?.fullName"></span> ni o'chirmoqchimisiz? Bu amal qaytarilmaydi.</p>
    </div>
    <div class="flex items-center gap-3 px-6 py-4 border-t border-slate-100">
      <button @click="showDelete = false" class="flex-1 px-4 py-2 rounded-lg text-sm font-medium border border-slate-200 text-slate-600 hover:bg-slate-50 transition-colors">Bekor qilish</button>
      <button @click="deleteUser()" :disabled="saving"
              class="flex-1 px-4 py-2 rounded-lg text-sm font-medium bg-red-500 hover:bg-red-600 text-white transition-colors disabled:opacity-60">
        <span x-show="!saving">O'chirish</span>
        <span x-show="saving" x-cloak>O'chirilmoqda...</span>
      </button>
    </div>
  </div>
</div>

<!-- ===== TOAST ===== -->
<div x-show="toast.visible" x-cloak x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 translate-y-2" x-transition:enter-end="opacity-100 translate-y-0" x-transition:leave="transition ease-in duration-200" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"
     class="fixed bottom-6 right-6 z-50 flex items-center gap-3 px-4 py-3 rounded-xl shadow-lg text-sm font-medium text-white"
     :class="toast.type === 'error' ? 'bg-red-500' : 'bg-emerald-500'">
  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path x-show="toast.type !== 'error'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
    <path x-show="toast.type === 'error'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
  </svg>
  <span x-text="toast.message"></span>
</div>

<script>
  function usersApp() {
    return {
      loading: true,
      saving: false,
      users: [],
      allUsers: [],
      totalElements: 0,
      totalPages: 1,
      page: 0,
      size: 15,
      filterRole: '',
      pageRange: [],
      currentUserName: 'Admin',

      showCreate: false,
      showEdit: false,
      showDelete: false,
      createError: '',
      editError: '',

      form: { fullName: '', phoneNumber: '', password: '', role: 'MEMBER' },
      editForm: { fullName: '', phoneNumber: '', password: '', role: 'MEMBER' },
      editingId: null,
      deleteTarget: null,

      toast: { visible: false, message: '', type: 'success' },

      async init() {
        this.loading = true;

        this.allUsers = [
          { id: 1, fullName: 'Sarvar Qodirov', phoneNumber: '998901234579', role: 'STAFF' },
          { id: 2, fullName: 'Malika Yusupova', phoneNumber: '998901234569', role: 'STAFF' },
          { id: 3, fullName: 'Jasur Hakimov', phoneNumber: '998901234568', role: 'MEMBER' },
          { id: 4, fullName: 'Bobur Rahimov', phoneNumber: '998901234570', role: 'MEMBER' },
          { id: 5, fullName: 'Zulfiya Karimova', phoneNumber: '998901234571', role: 'MEMBER' },
          { id: 6, fullName: 'Sherzod Mirzayev', phoneNumber: '998901234572', role: 'MEMBER' },
          { id: 7, fullName: 'Nilufar Qosimova', phoneNumber: '998901234573', role: 'MEMBER' },
          { id: 8, fullName: 'Umid Xasanov', phoneNumber: '998901234574', role: 'STAFF' },
          { id: 9, fullName: 'Dildora Nazarova', phoneNumber: '998901234575', role: 'MEMBER' },
          { id: 10, fullName: 'Dilshod Ismoilov', phoneNumber: '998901234578', role: 'STAFF' },
          { id: 11, fullName: 'Otabek Sultanov', phoneNumber: '998901234576', role: 'MEMBER' },
          { id: 12, fullName: 'Akmal Tursunov', phoneNumber: '998901234577', role: 'STAFF' },
          { id: 13, fullName: 'Gulnoza Ergasheva', phoneNumber: '998901234580', role: 'MEMBER' },
          { id: 13, fullName: 'Jamila Fayzullayeva', phoneNumber: '998971437100', role: 'MEMBER' },
        ];

        this.loadUsers();
        this.loading = false;
      },

      loadUsers() {
        let data = [...this.allUsers];

        if (this.filterRole) {
          data = data.filter(u => u.role === this.filterRole);
        }

        this.users = data;
        this.totalElements = data.length;
      },

      goPage() {},

      openCreateModal() {
        this.form = { fullName: '', phoneNumber: '', password: '', role: 'MEMBER' };
        this.createError = '';
        this.showCreate = true;
      },

      createUser() {
        if (!this.form.fullName || !this.form.phoneNumber || !this.form.password) {
          this.createError = "Barcha maydonlarni to'ldiring";
          return;
        }

        const newUser = {
          id: Date.now(),
          fullName: this.form.fullName,
          phoneNumber: this.form.phoneNumber,
          role: this.form.role
        };

        this.allUsers.unshift(newUser);
        this.loadUsers();

        this.showCreate = false;
        this.showToast("Foydalanuvchi qo'shildi");
      },

      openEdit(u) {
        this.editingId = u.id;
        this.editForm = { ...u, password: '' };
        this.editError = '';
        this.showEdit = true;
      },

      updateUser() {
        if (!this.editForm.fullName || !this.editForm.phoneNumber || !this.editForm.password) {
          this.editError = "Barcha maydonlarni to'ldiring";
          return;
        }

        const index = this.allUsers.findIndex(u => u.id === this.editingId);

        if (index !== -1) {
          this.allUsers[index] = {
            ...this.allUsers[index],
            ...this.editForm
          };
        }

        this.loadUsers();
        this.showEdit = false;
        this.showToast("Foydalanuvchi yangilandi");
      },

      openDelete(u) {
        this.deleteTarget = u;
        this.showDelete = true;
      },

      deleteUser() {
        this.allUsers = this.allUsers.filter(u => u.id !== this.deleteTarget.id);

        this.loadUsers();
        this.showDelete = false;
        this.showToast("Foydalanuvchi o'chirildi", 'error');
      },

      showToast(message, type = 'success') {
        this.toast = { visible: true, message, type };
        setTimeout(() => this.toast.visible = false, 3000);
      }
    }
  }
</script>
</body>
</html>
