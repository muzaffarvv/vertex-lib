<!DOCTYPE html>
<html lang="uz" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VertexLib — Kirish</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0f14;
    --surface: #161922;
    --border: #252933;
    --accent: #4f8ef7;
    --accent-dim: rgba(79,142,247,0.12);
    --text: #e8eaf0;
    --muted: #6b7280;
    --danger: #f56565;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'IBM Plex Sans', sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .login-wrap {
    width: 100%;
    max-width: 380px;
    padding: 0 16px;
  }

  .logo {
    font-family: var(--mono);
    font-size: 1.5rem;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: -0.02em;
    margin-bottom: 8px;
  }

  .logo span { color: var(--muted); }

  .subtitle {
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 40px;
    font-family: var(--mono);
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 32px;
  }

  .field { margin-bottom: 20px; }

  label {
    display: block;
    font-size: 0.75rem;
    font-family: var(--mono);
    color: var(--muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 14px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.15s;
  }

  input:focus { border-color: var(--accent); }

  .btn {
    width: 100%;
    background: var(--accent);
    border: none;
    border-radius: 6px;
    padding: 11px;
    color: #fff;
    font-family: var(--mono);
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
    transition: opacity 0.15s;
  }

  .btn:hover { opacity: 0.88; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .error-msg {
    background: rgba(245,101,101,0.1);
    border: 1px solid rgba(245,101,101,0.3);
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 0.82rem;
    color: var(--danger);
    margin-top: 16px;
    display: none;
    font-family: var(--mono);
  }

  .register-link {
    text-align: center;
    margin-top: 20px;
    font-size: 0.82rem;
    color: var(--muted);
  }

  .register-link a {
    color: var(--accent);
    text-decoration: none;
  }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="logo">Vertex<span>Lib</span></div>
  <div class="subtitle">// kutubxona boshqaruv tizimi</div>

  <div class="card">
    <div class="field">
      <label>Telefon raqami</label>
      <input type="text" id="phone" placeholder="998XXXXXXXXX" maxlength="12">
    </div>
    <div class="field">
      <label>Parol</label>
      <input type="password" id="password" placeholder="••••••••">
    </div>
    <button class="btn" id="loginBtn" onclick="doLogin()">Kirish</button>
    <div class="error-msg" id="errorMsg"></div>
  </div>

  <div class="register-link">
    Akkauntingiz yo'qmi? <a href="/register">Ro'yxatdan o'tish</a>
  </div>
</div>

<script>
  document.getElementById('password').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });

  async function doLogin() {
    const phone = document.getElementById('phone').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('loginBtn');
    const err = document.getElementById('errorMsg');

    err.style.display = 'none';

    if (!phone || !password) {
      showError('Barcha maydonlarni to\'ldiring');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Kutilmoqda...';

    try {
      const res = await fetch('/api/v1/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phoneNumber: phone, password })
      });

      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        showError(data.message || 'Telefon raqami yoki parol noto\'g\'ri');
        return;
      }

      const data = await res.json();
      localStorage.setItem('token', data.token);
      localStorage.setItem('user', JSON.stringify(data.uresp));
      window.location.href = '/dashboard';
    } catch (e) {
      showError('Server bilan bog\'lanishda xatolik');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Kirish';
    }
  }

  function showError(msg) {
    const err = document.getElementById('errorMsg');
    err.textContent = msg;
    err.style.display = 'block';
  }

  // Already logged in?
  if (localStorage.getItem('token')) window.location.href = '/dashboard';
</script>
</body>
</html>
